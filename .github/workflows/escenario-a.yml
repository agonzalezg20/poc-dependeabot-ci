name: Escenario A - Runtime (Sin Push)

on:
  workflow_dispatch:

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Crear manifiesto temporal en el runner
        run: |
          mkdir -p temp-runtime
          echo '{"name":"temp-app","version":"1.0.0","dependencies":{"axios":"0.18.0"}}' > temp-runtime/package.json
          echo "Archivo generado en memoria:"
          cat temp-runtime/package.json
